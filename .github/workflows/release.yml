name: Publish GitHub Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev,preview]'
      - name: Validate code
        run: |
          python -m compileall -q harp_pcb.py harp_ai.py harp_footprints.py harp_electrical.py harp_pinout.py tests
          python -m ruff check harp_pcb.py harp_ai.py harp_footprints.py harp_electrical.py harp_pinout.py tests
          python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Create release and attach build files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
