name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev,preview]'
      - name: Syntax check
        run: python -m compileall -q harp_pcb.py tests
      - name: Lint
        run: python -m ruff check harp_pcb.py tests
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Validate notebook JSON and Python cells
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          p=Path('notebooks/HARP_PCB_Colab.ipynb')
          nb=json.loads(p.read_text())
          assert nb['nbformat']==4
          for cell in nb['cells']:
              if cell['cell_type']=='code':
                  ast.parse(''.join(cell['source']))
          print('Notebook cells parse successfully')
          PY
      - name: Installed CLI smoke test
        run: harp-pcb --help
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
